name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Pinned: the runner image and package versions are fixed so a run does
      # not change when apt.llvm.org or ubuntu-latest move.
      - name: Install LLVM 18 and libstdc++ 14
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 clang-18 llvm-18 clang-tidy-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"

      - name: Build example
        run: make all

      - name: Build and run tests
        run: make test

      - name: Generate JUnit report
        if: always()
        run: ./build/test_runner --reporter junit --out build/test_report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test_report.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: build/test_report.xml
          reporter: java-junit

      - name: Generate coverage report
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Lint
        run: make lint

      - name: Build documentation
        run: |
          sudo apt-get install -y doxygen
          make docs

      - name: Upload documentation
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/api/html

  deploy-docs:
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
